name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  flutter-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Enforce service import rules
        run: dart run tool/check_service_imports.dart

      - name: Scan SECURITY DEFINER migrations (heuristic)
        run: dart run tool/scan_security_definer_migrations.dart

      - name: Create dummy .env for analyzer
        run: mkdir -p assets && touch assets/.env

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter test (with coverage)
        run: flutter test --coverage

      - name: Check code coverage threshold
        run: dart run tool/check_coverage.dart --min-coverage=26.0

      - name: Flutter build web (smoke test)
        run: |
          flutter build web --release --no-pub --no-wasm-dry-run
          dart run tool/copy_web_shell_assets.dart

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: coverage
          path: coverage/lcov.info

  db-integration-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google*.list || true
          sudo apt-get update -o Acquire::Retries=3 || true
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Start local Supabase stack
        run: npx supabase start

      - name: Reset local database
        run: npx supabase db reset --local --yes

      - name: Run order status flow integration SQL
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/order_status_flow_integration.sql

      - name: Regenerate local Supabase types
        run: npm run supabase:types:local

      - name: Verify generated types are committed
        shell: bash
        run: |
          if ! git diff --quiet -- supabase/types/database.types.ts; then
            echo "::warning file=supabase/types/database.types.ts::Supabase generated types differ from local schema. Run 'npm run supabase:types' to sync with hosted database."
            echo "Detected diff in supabase/types/database.types.ts:"
            git --no-pager diff --stat -- supabase/types/database.types.ts
          fi

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup
