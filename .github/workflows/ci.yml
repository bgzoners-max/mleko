name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  flutter-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Enforce service import rules
        run: dart run tool/check_service_imports.dart
      - name: Enforce cyrillic-free code
        run: dart run tool/check_cyrillic_strings.dart
      - name: Guard against committed keystores/secrets
        run: dart run tool/check_no_committed_secrets.dart
      - name: Enforce max file size
        run: dart run tool/check_file_size.dart

      - name: Scan SECURITY DEFINER migrations (heuristic)
        run: dart run tool/scan_security_definer_migrations.dart
      - name: Guard against seed test users in migrations
        run: dart run tool/check_no_seed_data_in_migrations.dart

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Flutter test (with coverage)
        run: flutter test --coverage

      - name: Check code coverage (ratchet threshold)
        run: dart run tool/check_coverage.dart --min-coverage=32.0 --ratchet-file=tool/coverage_ratchet.json

      - name: Verify coverage ratchet baseline is committed
        shell: bash
        run: |
          if ! git diff --quiet -- tool/coverage_ratchet.json; then
            echo "::error file=tool/coverage_ratchet.json::Coverage ratchet baseline changed but is not committed."
            echo "Coverage improved — commit the updated tool/coverage_ratchet.json ( isti obrazac kao STATUS.md)."
            git --no-pager diff -- tool/coverage_ratchet.json
            exit 1
          fi

      - name: Generate and verify STATUS.md
        shell: bash
        run: |
          dart run tool/generate_status.dart
          if ! git diff --quiet -- STATUS.md; then
            echo "::error file=STATUS.md::STATUS.md is out of date. Please run 'dart run tool/generate_status.dart' and commit the changes."
            git diff -- STATUS.md
            exit 1
          fi

      - name: Validate Digital Asset Links (assetlinks.json)
        run: node -e "const content = require('fs').readFileSync('web/.well-known/assetlinks.json', 'utf8'); const data = JSON.parse(content); if (!Array.isArray(data) || data.length === 0) throw new Error('assetlinks.json must be a non-empty array');"

      - name: Flutter build web (smoke test)
        run: |
          flutter build web --release --no-pub --no-wasm-dry-run
          dart run tool/copy_web_shell_assets.dart

      - name: Generate HTML coverage report
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends lcov > /dev/null 2>&1 || true
          genhtml coverage/lcov.info -o coverage/html --no-function-coverage --quiet || true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: coverage
          path: |
            coverage/lcov.info
            coverage/coverage_summary.json
            coverage/html/

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # Integration testovi (checkout flow E2E sa mock servisima) na headless
      # flutter-tester uređaju. Na mašinama sa više uređaja flutter traži
      # interaktivni izbor, pa se uređaj navodi eksplicitno (-d flutter-tester).
      # SVAKI fajl se pokreće u zasebnoj invokaciji — zajednička invokacija
      # više fajlova na Linux flutter-tester-u ponekad pada sa
      # "The log reader failed unexpectedly" pri restartu device-a.
      - name: Run integration tests (headless flutter-tester)
        run: |
          flutter test integration_test/app_test.dart -d flutter-tester
          flutter test integration_test/checkout_flow_test.dart -d flutter-tester

  db-integration-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript type-check (Vercel edge functions)
        run: npm run type-check

      - name: Validate Digital Asset Links (assetlinks.json)
        run: npm run validate:assetlinks

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase edge functions
        run: deno check --config supabase/functions/deno.json supabase/functions/send-push/index.ts

      - name: Install PostgreSQL client
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google*.list || true
          sudo apt-get update -o Acquire::Retries=3 || true
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Start local Supabase stack
        run: npx supabase start

      - name: Reset local database
        run: npx supabase db reset --local --yes

      - name: Run order status flow integration SQL
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/order_status_flow_integration.sql

      - name: Run create order RPC parity & security integration SQL
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/create_order_rpc_integration.sql

      - name: Regenerate local Supabase types
        run: npm run supabase:types:local

      - name: Verify generated types match migrations exactly
        shell: bash
        run: |
          if ! git diff --quiet -- supabase/types/database.types.ts; then
            echo "::error file=supabase/types/database.types.ts::Schema drift detected! Generated types from migrations differ from committed database.types.ts. Run 'npm run supabase:types:local' after updating migrations."
            echo "Detected diff in supabase/types/database.types.ts:"
            git --no-pager diff --stat -- supabase/types/database.types.ts
            git --no-pager diff -- supabase/types/database.types.ts
            exit 1
          fi

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup
