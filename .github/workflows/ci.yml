name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  flutter-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Enforce service import rules
        run: dart run tool/check_service_imports.dart

      - name: Scan SECURITY DEFINER migrations (heuristic)
        run: dart run tool/scan_security_definer_migrations.dart

      - name: Create dummy .env for analyzer
        run: mkdir -p assets && touch assets/.env

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter test (with coverage)
        run: flutter test --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  db-integration-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Start local Supabase stack
        run: npx supabase start

      - name: Reset local database
        run: npx supabase db reset --local --yes

      - name: Run order status flow integration SQL
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/order_status_flow_integration.sql

      - name: Regenerate local Supabase types
        run: npm run supabase:types:local

      - name: Verify generated types are committed
        shell: bash
        run: |
          if ! git diff --quiet -- supabase/types/database.types.ts; then
            echo "::error file=supabase/types/database.types.ts::Supabase generated types are out of date. Run 'npm run supabase:types' after updating migrations and commit the regenerated file."
            echo "Detected diff in supabase/types/database.types.ts:"
            git --no-pager diff -- supabase/types/database.types.ts
            exit 1
          fi

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup
