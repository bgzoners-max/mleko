name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  flutter-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Enforce service import rules
        run: dart run tool/check_service_imports.dart

      - name: Scan SECURITY DEFINER migrations (heuristic)
        run: dart run tool/scan_security_definer_migrations.dart

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test (with coverage)
        run: flutter test --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
