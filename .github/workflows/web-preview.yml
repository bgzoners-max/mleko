name: Web Preview Build
on:
  push:
    branches: [ main, master ]
  pull_request: # Pokreće staging preview za svaki PR
  workflow_dispatch: # Omogućava ručno pokretanje build-a iz GitHub UI-a

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create dummy .env for build
        run: mkdir -p assets && touch assets/.env

      - name: Build Web
        run: flutter build web --release --base-href /

      - name: Archive Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MLEKO }}'
          expires: 7d
          projectId: mleko-686eb
          channelId: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'live' }}
