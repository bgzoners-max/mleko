name: Web Preview Build
on:
  pull_request: # Pokreće staging preview za svaki PR
  workflow_dispatch: # Omogućava ručno pokretanje build-a iz GitHub UI-a

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href /

      - name: Archive Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

      # Preview deploy SAMO za PR-ove (Firebase channel `pr-<broj>`, ističe za 7d).
      # Push na master se NE deployuje ovde: produkciona verzija ide isključivo
      # kroz deploy-cloudflare.yml (Cloudflare Pages, domacimarket.rs).
      # Time se sprečava da Firebase Hosting `live` kanal postane neočekivani
      # drugi produkcioni deploy van rollback procedura iz docs/DEPLOYMENT.md.
      - name: Deploy to Firebase Hosting (PR preview only)
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MLEKO }}'
          expires: 7d
          projectId: mleko-686eb
          channelId: 'pr-${{ github.event.number }}'
