name: Deploy Staging to Vercel

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (Staging)
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL_STAGING }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY_STAGING }} \
            --dart-define=SHARE_BASE_URL=${{ secrets.STAGING_BASE_URL || 'https://staging.domacimarket.rs' }}

      - name: Copy web shell assets
        run: dart run tool/copy_web_shell_assets.dart

      - name: Prepare Vercel deploy bundle
        run: dart run tool/prepare_vercel_deploy.dart

      - name: Copy well-known directory
        run: cp -r web/.well-known build/vercel-deploy/

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel (Staging)
        run: vercel deploy build/vercel-deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_STAGING }}
