include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Stil i konzistentnost
    avoid_print: true
    avoid_empty_else: true
    # Aktivan od 2026-10-24 — svih 75 istorijskih nalaza očišćeno u kaskade
    # (lib/, test/, integration_test/). CI pokreće `flutter analyze --fatal-infos`,
    # pa je svaki info nalaz fatalan — održavaj kaskade u novom kodu.
    cascade_invocations: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_fields: true
    avoid_init_to_null: true
    unnecessary_nullable_for_final_variable_declarations: true
    use_super_parameters: true
    use_key_in_widget_constructors: true
    prefer_final_locals: true

    # Bezbednost i korektnost
    cancel_subscriptions: true
    unawaited_futures: true
    close_sinks: true
    use_build_context_synchronously: true

analyzer:
  errors:
    todo: info
    unnecessary_nullable_for_final_variable_declarations: warning
    close_sinks: error
    unawaited_futures: error
    use_build_context_synchronously: warning

  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Alati izvan `lib/` — ručne skripte, `print` je nameran CLI izlaz.
    - tool/**
    - "lib/l10n/**"
    - ".dart_tool/**"
