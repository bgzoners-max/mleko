name: mleko
description: "Naše Selo – marketplace za domaće proizvode iz sela."
publish_to: 'none'
version: 1.1.6+16

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  supabase_flutter: ^2.18.3
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  firebase_crashlytics: ^6.0.0
  flutter_local_notifications: ^22.3.2
  permission_handler: ^13.0.2
  geolocator: ^14.1.1

  # Connectivity
  connectivity_plus: ^7.1.0

  # UI & navigation
  go_router: ^18.1.0
  provider: ^6.1.1
  cached_network_image: ^4.0.4
  image_picker: ^1.2.4
  cupertino_icons: ^1.0.8

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.0
  url_launcher: ^6.2.4
  share_plus: ^13.3.0
  shimmer: ^4.0.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^11.2.0
  workmanager: ^0.10.10
  flutter_map: ^8.2.2
  latlong2: ^0.9.0
  google_fonts: ^8.0.2
  image: ^4.12.0
  firebase_analytics: ^13.0.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/google_fonts/
    - assets/images/
    - assets/images/categories/
    - assets/images/car_brands/
    - assets/images/phone_brands/
    - assets/images/tractor_brands/
    - assets/icon/

  fonts:
    - family: Lucide
      fonts:
        - asset: assets/fonts/lucide.ttf


flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: "assets/icon/app_icon.png"

