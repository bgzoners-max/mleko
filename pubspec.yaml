name: mleko
description: "Naše Selo – marketplace za domaće proizvode iz sela."
publish_to: 'none'
version: 1.1.6+16

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  supabase_flutter: ^2.8.0
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^18.0.1
  permission_handler: ^12.0.1
  geolocator: ^13.0.2

  # Connectivity
  connectivity_plus: ^5.0.0

  # UI & navigation
  go_router: ^17.1.0
  provider: ^6.1.1
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  carousel_slider: ^5.0.0

  # Utils
  intl: ^0.20.2
  uuid: ^4.2.2
  url_launcher: ^6.2.4
  share_plus: ^12.0.1
  shimmer: ^3.0.0
  shared_preferences: ^2.2.2
  workmanager: ^0.7.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: "assets/icon/app_icon.png"
